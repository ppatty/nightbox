<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #100e0c; }
  .row { display: flex; gap: 16px; align-items: center; padding: 16px; }
  img { display: block; background: #100e0c; }
</style>
</head>
<body>
  <div class="row">
    <img src="favicon.svg" width="16" height="16" alt="16">
    <img src="favicon.svg" width="32" height="32" alt="32">
    <img src="favicon.svg" width="64" height="64" alt="64">
    <img src="favicon.svg" width="180" height="180" alt="180">
  </div>
</body>
</html>
